# XcodeGen: `xcodegen generate` régénère Sandia.xcodeproj depuis ce fichier.
# Le .xcodeproj généré est versionné, Xcode s'ouvre donc sans installer XcodeGen.
name: Sandia

options:
  bundleIdPrefix: fr.jbahu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: BG55CF653X
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    DEAD_CODE_STRIPPING: YES

targets:
  SandiaCore:
    type: framework
    platform: macOS
    sources:
      - Sources/SandiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.sandia.core
        PRODUCT_NAME: SandiaCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  Sandia:
    type: application
    platform: macOS
    sources:
      - Sources/Sandia
      - Resources
    dependencies:
      - target: SandiaCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.sandia
        PRODUCT_NAME: Sandia
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  SandiaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SandiaCoreTests
    dependencies:
      - target: SandiaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.sandia.coretests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  Sandia:
    build:
      targets:
        Sandia: all
        SandiaCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SandiaCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
