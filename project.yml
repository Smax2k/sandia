# XcodeGen: `xcodegen generate` régénère Dvsk.xcodeproj depuis ce fichier.
# Le .xcodeproj généré est versionné, Xcode s'ouvre donc sans installer XcodeGen.
name: Dvsk

options:
  bundleIdPrefix: fr.jbahu
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: 5PC4RUY4PJ
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEAD_CODE_STRIPPING: YES

targets:
  DvskCore:
    type: framework
    platform: macOS
    sources:
      - Sources/DvskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.dvsk.core
        PRODUCT_NAME: DvskCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  Dvsk:
    type: application
    platform: macOS
    sources:
      - Sources/Dvsk
      - Resources
    dependencies:
      - target: DvskCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.dvsk
        PRODUCT_NAME: Dvsk
        INFOPLIST_FILE: AppInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  DvskCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DvskCoreTests
    dependencies:
      - target: DvskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.jbahu.dvsk.coretests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  Dvsk:
    build:
      targets:
        Dvsk: all
        DvskCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DvskCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
